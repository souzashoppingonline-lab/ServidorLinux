<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSM - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0e1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #e2e8f0;
        }
        .login-container {
            background: #111827;
            border: 1px solid #1e2d3d;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo { font-size: 3rem; display: block; margin-bottom: 0.5rem; }
        .login-title { font-size: 1.5rem; font-weight: 700; color: #60a5fa; }
        .login-sub { color: #64748b; font-size: 0.875rem; margin-top: 0.25rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: #94a3b8; }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border: 1px solid #1e2d3d;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #3b82f6; }
        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }
        .btn-login:hover { background: #2563eb; }
        .btn-login:disabled { background: #1e40af; cursor: not-allowed; opacity: 0.7; }
        .error-msg {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }
        .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <span class="login-logo">🛡️</span>
            <div class="login-title">Linux Security Monitor</div>
            <div class="login-sub">Painel de Segurança</div>
        </div>
        <div class="error-msg" id="error-msg"></div>
        <form onsubmit="doLogin(event)">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="username" value="admin" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login" id="login-btn">Entrar</button>
        </form>
        <div class="footer">Linux Security Monitor v1.0.0</div>
    </div>
    <script>
        async function doLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('error-msg');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Entrando...';
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json();
                    errorEl.textContent = data.error || 'Credenciais inválidas';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                }
            } catch {
                errorEl.textContent = 'Erro de conexão. Tente novamente.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        }
    </script>
</body>
</html>
