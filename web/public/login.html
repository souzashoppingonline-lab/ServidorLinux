<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC Dashboard — Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0e1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #e2e8f0;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(79, 142, 247, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 212, 161, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 80%, rgba(156, 39, 176, 0.05) 0%, transparent 50%);
            pointer-events: none;
            animation: bgShift 12s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0%   { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* Grid lines effect */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(79,142,247,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79,142,247,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 1rem;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05) inset,
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 80px rgba(79, 142, 247, 0.05);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.25rem;
        }

        .login-logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, rgba(79,142,247,0.2), rgba(0,212,161,0.15));
            border: 1px solid rgba(79,142,247,0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.25rem;
            box-shadow: 0 0 30px rgba(79,142,247,0.15);
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4f8ef7, #00d4a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.375rem;
        }

        .login-sub {
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 0.03em;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            font-size: 0.9rem;
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.75rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input:focus {
            outline: none;
            border-color: rgba(79,142,247,0.5);
            background: rgba(79,142,247,0.04);
            box-shadow: 0 0 0 3px rgba(79,142,247,0.1);
        }

        input::placeholder { color: #334155; }

        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #4f8ef7, #2563eb);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.925rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
        }

        .btn-login::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            pointer-events: none;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(79,142,247,0.35);
        }

        .btn-login:active:not(:disabled) { transform: translateY(0); }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .error-msg {
            background: rgba(255, 71, 87, 0.08);
            border: 1px solid rgba(255, 71, 87, 0.25);
            color: #ff6b7a;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            font-size: 0.8rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .footer {
            text-align: center;
            margin-top: 1.75rem;
            color: #334155;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }

        .status-dots {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(79,142,247,0.3);
            animation: dotPulse 2s ease-in-out infinite;
        }

        .status-dot:nth-child(2) { animation-delay: 0.3s; }
        .status-dot:nth-child(3) { animation-delay: 0.6s; }

        @keyframes dotPulse {
            0%, 100% { background: rgba(79,142,247,0.3); }
            50% { background: rgba(0,212,161,0.6); }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">🛡️</div>
                <div class="login-title">NOC Dashboard</div>
                <div class="login-sub">Linux Security Monitor</div>
            </div>

            <div class="error-msg" id="error-msg">
                <span>⚠</span>
                <span id="error-text">Credenciais inválidas</span>
            </div>

            <form onsubmit="doLogin(event)">
                <div class="form-group">
                    <label>Usuário</label>
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" value="admin" autocomplete="username" required autofocus placeholder="admin">
                    </div>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="btn-login" id="login-btn">Entrar no Dashboard</button>
            </form>

            <div class="footer">
                NOC Dashboard v2.0.0 — Sistema de Monitoramento
                <div class="status-dots">
                    <div class="status-dot"></div>
                    <div class="status-dot"></div>
                    <div class="status-dot"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function doLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Verificando...';
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                if (res.ok) {
                    btn.textContent = 'Acesso concedido ✓';
                    setTimeout(() => { window.location.href = '/'; }, 400);
                } else {
                    const data = await res.json();
                    errorText.textContent = data.error || 'Credenciais inválidas';
                    errorEl.style.display = 'flex';
                    btn.disabled = false;
                    btn.textContent = 'Entrar no Dashboard';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            } catch {
                errorText.textContent = 'Erro de conexão. Tente novamente.';
                errorEl.style.display = 'flex';
                btn.disabled = false;
                btn.textContent = 'Entrar no Dashboard';
            }
        }
    </script>
</body>
</html>
