<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Dashboard — CFO Mercado Livre</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">📊</div>
        <div>
          <div class="sidebar-logo-name">ML Dashboard</div>
          <div class="sidebar-logo-sub">CFO Suite</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="#dashboard"  class="nav-item active" data-page="dashboard">
        <span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span>
      </a>
      <a href="#listings"   class="nav-item" data-page="listings">
        <span class="nav-icon">📦</span><span class="nav-label">Anúncios</span>
      </a>
      <a href="#orders"     class="nav-item" data-page="orders">
        <span class="nav-icon">🛒</span><span class="nav-label">Pedidos</span>
      </a>
      <a href="#questions"  class="nav-item" data-page="questions">
        <span class="nav-icon">❓</span><span class="nav-label">Perguntas</span>
        <span class="nav-badge" id="questionsBadge" style="display:none">0</span>
      </a>
      <a href="#messages"   class="nav-item" data-page="messages">
        <span class="nav-icon">💬</span><span class="nav-label">Mensagens</span>
      </a>
      <a href="#metrics"    class="nav-item" data-page="metrics">
        <span class="nav-icon">📈</span><span class="nav-label">Métricas</span>
      </a>
      <div class="nav-divider"></div>
      <a href="#stores"     class="nav-item" data-page="stores">
        <span class="nav-icon">🏪</span><span class="nav-label">Lojas</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebarUser">
        <div class="sidebar-avatar" id="sidebarAvatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebarName">Carregando...</div>
          <div class="sidebar-user-role">Administrador</div>
        </div>
      </div>
      <button class="btn-logout" id="btnLogout" title="Sair">⏻</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-wrapper">
    <!-- TOP BAR -->
    <header class="topbar">
      <button class="btn-toggle-sidebar" id="btnToggleSidebar">☰</button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-right">
        <div class="store-selector-wrap">
          <label class="store-label">Loja:</label>
          <select class="store-select" id="storeSelect"></select>
        </div>
        <div class="topbar-refresh" id="btnRefresh" title="Atualizar dados">↻</div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="content" id="content">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Carregando...</p>
      </div>
    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Modal</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
