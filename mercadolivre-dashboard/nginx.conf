# Nginx config for ML Dashboard
# Copy to: /etc/nginx/sites-available/ml-dashboard
# Then: ln -s /etc/nginx/sites-available/ml-dashboard /etc/nginx/sites-enabled/
# Requires certbot: certbot --nginx -d multimixvendas.duckdns.org

server {
    listen 80;
    server_name multimixvendas.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name multimixvendas.duckdns.org;

    # SSL (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/multimixvendas.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/multimixvendas.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;

    # ML Dashboard (port 3001)
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # Static asset caching
    location ~* \.(css|js|png|svg|ico|woff2)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
